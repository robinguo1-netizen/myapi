# Builds the root new-api Dockerfile, including the current RS frontend.
# Source is a temporary git archive; local secrets and ignored files are absent.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --platform=linux/amd64, --label, 'org.opencontainers.image.revision=${COMMIT_SHA}', --tag, '${_IMAGE}', --file, Dockerfile, .]
images:
  - '${_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 1800s
substitutions:
  _IMAGE: europe-west1-docker.pkg.dev/project-0338f2b7-06cf-4c5a-989/rs-test/new-api:review-only
